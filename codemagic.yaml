workflows:
  ios-build:
    name: iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: 3.27.5
      xcode: 16.2
      ios_signing:
        provisioning_profile_type: automatic
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: 安装依赖
        script: flutter pub get
      - name: 测试
        script: flutter test || echo "没有测试用例，跳过"
        ignore_failure: true
      - name: 构建 iOS
        script: flutter build ios --debug
    artifacts:
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
